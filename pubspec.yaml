name: taskflow_ai
description: "TaskFlow AI - Premium task manager with AI-powered productivity."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local storage
  shared_preferences: ^2.3.3

  # Charts
  fl_chart: ^0.70.2

  # Google Fonts (Poppins + Inter)
  google_fonts: ^6.2.1

  # Date/time
  intl: ^0.20.2

  # Table calendar
  table_calendar: ^3.1.3

  # Animations
  flutter_animate: ^4.5.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # REST API
  http: ^1.2.2
  firebase_crashlytics: ^4.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#E8E4F8"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/google_fonts/
